name: Bitcoin Intelligence Strategy Confirmation

# Out-of-time confirmation. The profiles were chosen by looking at
# results from 2025-11-02 onward, so everything before that date is data
# the choice never saw. Each profile is replayed over every continuous
# stretch of Kraken history since 2020, one calendar year per job, and
# scored with that earlier period as a separate holdout. Manual only.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Ignore history before this date"
        default: "2020-01-01"
      holdout_before:
        description: "Trades before this date are the untouched confirmation set"
        default: "2025-11-02"
      step:
        description: "Check for a signal every N five-minute candles (12 = hourly)"
        default: "12"

permissions:
  contents: write

concurrency:
  group: bitcoin-intelligence-confirmation
  cancel-in-progress: false

env:
  DATA_BRANCH: runtime-data

jobs:
  history:
    name: Import continuous history stretches
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Read XBTUSD 5m from the full Kraken archive
        run: |
          mkdir -p raw
          python -m backtesting.remote_zip raw/XBTUSD_5.csv
          wc -l raw/XBTUSD_5.csv
      - name: Split into continuous stretches
        run: |
          python main.py import-history raw/XBTUSD_5.csv --pair XBTUSD \
            --segmented --since "${{ inputs.since }}" --min-days 14 \
            --output-dir segments | tee import.txt
          cat segments/segments.json | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: segments
          path: segments
          retention-days: 3

  shard:
    name: ${{ matrix.profile }} TP2 ${{ matrix.year }}
    needs: history
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        profile: [baseline, h1_base, h1_regime, h1_regime_di]
        year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: segments
          path: segments
      - name: Backtest this year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          python main.py backtest-shard --segments-dir segments \
            --profile "${{ matrix.profile }}" --target 2 \
            --step "${{ inputs.step }}" \
            --from "${{ matrix.year }}-01-01" --to "${next}-01-01" \
            --output "shards/shard_${{ matrix.profile }}_TP2_${{ matrix.year }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.profile }}-${{ matrix.year }}
          path: shards
          retention-days: 3

  confirm:
    name: Combine, score and publish
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: Score every profile
        run: |
          for profile in baseline h1_base h1_regime h1_regime_di; do
            python main.py evaluate-shards --inputs shards \
              --profile "$profile" --target 2 \
              --holdout-before "${{ inputs.holdout_before }}" \
              --output-dir reports > /dev/null
          done
          python -m backtesting.experiment_summary reports | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to runtime-data
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/data-store"
          git clone --quiet --depth 1 --branch "$DATA_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$store"
          mkdir -p "$store/backtests/confirmation"
          cp reports/performance_*_TP2.json "$store/backtests/confirmation/"
          cp summary.md "$store/backtests/confirmation/SUMMARY.md"
          cd "$store"
          git config user.name "bitcoin-intelligence-bot"
          git config user.email "bitcoin-intelligence-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "data: strategy confirmation $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git push --quiet origin "HEAD:$DATA_BRANCH" && exit 0
            git pull --quiet --rebase origin "$DATA_BRANCH" || true
          done
          exit 1
