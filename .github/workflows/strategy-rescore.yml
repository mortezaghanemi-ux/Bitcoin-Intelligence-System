name: Bitcoin Intelligence Strategy Rescore

# Re-scores the shard results of an earlier Strategy Confirmation run
# without recomputing them (shards are kept for 3 days).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Strategy Confirmation run with the shard artifacts"
        required: true
      holdout_before:
        description: "Trades before this date are the untouched confirmation set"
        default: "2025-11-02"

permissions:
  contents: write
  actions: read

env:
  DATA_BRANCH: runtime-data

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Score every profile
        run: |
          ls shards | head -40
          for profile in baseline h1_base h1_regime h1_regime_di; do
            python main.py evaluate-shards --inputs shards \
              --profile "$profile" --target 2 \
              --holdout-before "${{ inputs.holdout_before }}" \
              --output-dir reports > /dev/null
          done
          python -m backtesting.experiment_summary reports | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to runtime-data
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/data-store"
          git clone --quiet --depth 1 --branch "$DATA_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$store"
          mkdir -p "$store/backtests/confirmation"
          cp reports/performance_*_TP2.json "$store/backtests/confirmation/"
          cp summary.md "$store/backtests/confirmation/SUMMARY.md"
          cd "$store"
          git config user.name "bitcoin-intelligence-bot"
          git config user.email "bitcoin-intelligence-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "data: strategy confirmation $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git push --quiet origin "HEAD:$DATA_BRANCH" && exit 0
            git pull --quiet --rebase origin "$DATA_BRANCH" || true
          done
          exit 1
