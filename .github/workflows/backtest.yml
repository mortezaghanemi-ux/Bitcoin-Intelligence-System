name: Bitcoin Intelligence Backtest

# Measures the real past win rate of the signal engine on Kraken's
# downloadable 5-minute history. Manual only; takes 1-3 hours.

on:
  workflow_dispatch:
    inputs:
      last_days:
        description: "Use only the most recent N days of history"
        default: "1095"
      step:
        description: "Check for a signal every N five-minute candles (12 = hourly)"
        default: "12"
      target:
        description: "Which take-profit counts as a win (1, 2 or 3)"
        default: "1"
      source:
        description: "full = multi-year history from Kraken's full archive; quarters = only the listed quarterly files"
        default: "full"
      quarters:
        description: "Used when source is quarters (space separated)"
        default: "2026Q1 2026Q2 2026Q3"

permissions:
  contents: write

concurrency:
  group: bitcoin-intelligence-backtest
  cancel-in-progress: false

env:
  DATA_BRANCH: runtime-data
  KRAKEN_BASE: https://assets.kraken.com/marketing/institutions

jobs:
  backtest:
    name: Download history, import and backtest
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Kraken 5-minute history (full archive, ranged)
        if: ${{ inputs.source == 'full' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kraken"
          python -m backtesting.remote_zip "$RUNNER_TEMP/kraken/XBTUSD_5.csv"
          wc -l "$RUNNER_TEMP/kraken/XBTUSD_5.csv"
          head -1 "$RUNNER_TEMP/kraken/XBTUSD_5.csv"
          tail -1 "$RUNNER_TEMP/kraken/XBTUSD_5.csv"

      - name: Download Kraken 5-minute history (quarterly files)
        if: ${{ inputs.source != 'full' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kraken"
          : > "$RUNNER_TEMP/kraken/XBTUSD_5_all.csv"
          for q in ${{ inputs.quarters }}; do
            zip="$RUNNER_TEMP/kraken/Kraken_OHLCVT_${q}.zip"
            url="$KRAKEN_BASE/Kraken_OHLCVT_${q}.zip"
            echo "== $q: $url"
            curl -fL --retry 3 --retry-delay 10 -o "$zip" "$url"
            ls -l "$zip"
            # Find the bitcoin/USD 5-minute file inside the archive.
            member=$(unzip -Z1 "$zip" | grep -E '(^|/)(XBTUSD|BTCUSD)_5\.csv$' | head -1 || true)
            if [ -z "$member" ]; then
              echo "No XBTUSD_5.csv in $q. Candidates:" >&2
              unzip -Z1 "$zip" | grep -iE '(XBT|BTC).*USD' | head -20 >&2
              exit 1
            fi
            echo "using $member"
            unzip -p "$zip" "$member" >> "$RUNNER_TEMP/kraken/XBTUSD_5_all.csv"
            rm -f "$zip"
          done
          # Sort by time and drop duplicate timestamps across quarters.
          sort -t, -k1,1n -u "$RUNNER_TEMP/kraken/XBTUSD_5_all.csv" \
            > "$RUNNER_TEMP/kraken/XBTUSD_5.csv"
          wc -l "$RUNNER_TEMP/kraken/XBTUSD_5.csv"
          head -2 "$RUNNER_TEMP/kraken/XBTUSD_5.csv"
          tail -1 "$RUNNER_TEMP/kraken/XBTUSD_5.csv"

      - name: Import history
        run: python main.py import-history "$RUNNER_TEMP/kraken/XBTUSD_5.csv" --pair XBTUSD

      - name: Run backtest
        run: |
          set -o pipefail
          python main.py backtest --target "${{ inputs.target }}" \
            --step "${{ inputs.step }}" --last-days "${{ inputs.last_days }}" \
            2>&1 | tee backtest-result.txt

      - name: Persist report
        run: |
          set -euo pipefail
          test -f data/backtests/performance_latest.json
          store="$RUNNER_TEMP/data-store"
          git clone --quiet --depth 1 --branch "$DATA_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$store"
          mkdir -p "$store/backtests"
          cp -a data/backtests/. "$store/backtests/"
          cd "$store"
          git config user.name "bitcoin-intelligence-bot"
          git config user.email "bitcoin-intelligence-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "data: backtest report $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push --quiet origin "HEAD:$DATA_BRANCH"; then
              echo "Persisted backtest report"
              exit 0
            fi
            git pull --quiet --rebase origin "$DATA_BRANCH" || true
          done
          echo "Could not persist report" >&2
          exit 1

      - name: Save backtest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-intelligence-backtest-result
          path: |
            backtest-result.txt
            data/backtests/performance_latest.json
          if-no-files-found: ignore
          retention-days: 30
