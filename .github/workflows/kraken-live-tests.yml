name: Kraken Live Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kraken-live:
    name: Run Live Kraken API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run live Kraken integration tests
        env:
          RUN_KRAKEN_LIVE_TESTS: "1"
        run: |
          python -m pytest -v \
            tests/integration/test_kraken_live.py