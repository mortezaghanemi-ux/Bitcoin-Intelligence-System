
name: Storage Persistence Isolation Test

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Choose the persistence test phase"
        required: true
        type: choice
        options:
          - seed
          - verify

permissions:
  contents: write

concurrency:
  group: storage-persistence-isolation-test
  cancel-in-progress: false

jobs:
  persistence-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code branch
        uses: actions/checkout@v4
        with:
          ref: storage-persistence-test
          path: code

      - name: Checkout isolated runtime data branch
        uses: actions/checkout@v4
        with:
          ref: runtime-data-test
          path: runtime-data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed first persistence marker
        if: inputs.phase == 'seed'
        working-directory: runtime-data
        run: |
          mkdir -p persistence-test
          printf '%s\n' 'PERSIST_TEST_001' > persistence-test/markers.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence-test/markers.txt
          git commit -m "test: seed persistence marker"
          git push origin HEAD:runtime-data-test

      - name: Verify first marker and append second marker
        if: inputs.phase == 'verify'
        working-directory: runtime-data
        run: |
          test -f persistence-test/markers.txt
          grep -Fxq 'PERSIST_TEST_001' persistence-test/markers.txt
          if grep -Fxq 'PERSIST_TEST_002' persistence-test/markers.txt; then
            echo "Second marker already exists; refusing duplicate write."
            exit 1
          fi
          printf '%s\n' 'PERSIST_TEST_002' >> persistence-test/markers.txt
          test "$(grep -Fxc 'PERSIST_TEST_001' persistence-test/markers.txt)" -eq 1
          test "$(grep -Fxc 'PERSIST_TEST_002' persistence-test/markers.txt)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistence-test/markers.txt
          git commit -m "test: verify persistence and append second marker"
          git push origin HEAD:runtime-data-test

      - name: Confirm persisted markers
        if: inputs.phase == 'verify'
        working-directory: runtime-data
        run: |
          grep -Fx 'PERSIST_TEST_001' persistence-test/markers.txt
          grep -Fx 'PERSIST_TEST_002' persistence-test/markers.txt
