
name: Storage Persistence Isolation Test

on:
  push:
    branches:
      - storage-persistence-test

permissions:
  contents: write

concurrency:
  group: storage-persistence-isolation-test
  cancel-in-progress: false

jobs:
  persistence-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code branch
        uses: actions/checkout@v4
        with:
          ref: storage-persistence-test
          path: code

      - name: Checkout isolated runtime data branch
        uses: actions/checkout@v4
        with:
          ref: runtime-data-test
          path: runtime-data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test persistent storage
        working-directory: runtime-data
        run: |
          set -e

          mkdir -p persistence-test
          FILE="persistence-test/markers.txt"

          if [ ! -f "$FILE" ]; then
            echo "FIRST RUN: Creating first marker."
            printf '%s\n' 'PERSIST_TEST_001' > "$FILE"
          else
            echo "NEXT RUN: Checking previously saved marker."

            test "$(grep -Fxc 'PERSIST_TEST_001' "$FILE")" -eq 1

            if grep -Fxq 'PERSIST_TEST_002' "$FILE"; then
              echo "Both markers already exist. Verifying storage."
            else
              echo "Appending second marker."
              printf '%s\n' 'PERSIST_TEST_002' >> "$FILE"
            fi
          fi

          test "$(grep -Fxc 'PERSIST_TEST_001' "$FILE")" -eq 1

          if grep -Fxq 'PERSIST_TEST_002' "$FILE"; then
            test "$(grep -Fxc 'PERSIST_TEST_002' "$FILE")" -eq 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"

          if ! git diff --cached --quiet; then
            git commit -m "test: update persistence markers"
            git push origin HEAD:runtime-data-test
          else
            echo "No changes required."
          fi

          echo "Final persisted data:"
          cat "$FILE"
