
name: Bitcoin Intelligence Main Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitcoin-intelligence-main-runtime
  cancel-in-progress: false

jobs:
  run-main-runtime:
    name: Run Scheduler and Trading Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate project configuration
        run: python main.py check-config

      - name: Run the main scheduler cycle
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -o pipefail
          python -m scheduler.runtime --once 2>&1 | tee scheduler-result.txt

      - name: Save runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-intelligence-runtime-result
          path: scheduler-result.txt
          if-no-files-found: ignore
          retention-days: 7
