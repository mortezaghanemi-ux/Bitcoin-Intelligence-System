timezone: UTC

trader:
  timeframes:
    - name: 5m
      minutes: 5
      seconds: 300

    - name: 15m
      minutes: 15
      seconds: 900

    - name: 1h
      minutes: 60
      seconds: 3600

    - name: 4h
      minutes: 240
      seconds: 14400

forecast:
  primary_timeframe:
    name: 1d
    minutes: 1440
    seconds: 86400

  horizon_days: 7

rules:
  use_closed_candles_only: true
  prevent_lookahead_bias: true
  align_timestamps_to_utc: true