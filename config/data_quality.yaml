validation:
  require_utc_timestamps: true
  reject_missing_values: true
  reject_duplicate_records: true
  reject_invalid_prices: true
  verify_ohlc_consistency: true
  require_closed_candles: true

freshness:
  enabled: true
  source_specific_limits: true
  reject_stale_data: true

history:
  preserve_raw_data: true
  preserve_validation_results: true
  allow_historical_overwrite: false

failure_policy:
  stop_dependent_workflows: true
  record_validation_errors: true
  allow_invalid_data_for_analysis: false