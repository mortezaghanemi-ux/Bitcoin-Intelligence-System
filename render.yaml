
services:
  - type: web
    name: bitcoin-intelligence-dashboard
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python -m dashboard.app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
